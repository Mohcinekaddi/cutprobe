model: ../models/resnet152-v2-7.onnx

preprocess:
  channel_order: RGB
  pixel_scale: 0.00392156862745098
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  resize_short: 256

platform:
  gpu_slot: 5
  resources: [localhost_gpu0, localhost_cpu012, localhost_cpu34, localhost_cpu6789]

autodice:
  bench_image: ../data/imagenet/bench.JPEG
  labels: ../data/imagenet/synset_words.txt

search:
  levels: analytic+measure
  l1_pop: 200
  l1_gen: 800
  l2_pop: 36
  l2_gen: 30

attack:
  csv: ../data/imagenet/test.csv
  dataset_dir: ../data/imagenet/val/
  max_images: 48000
  n_buffer: 200
  batch: 48
  configs:
    - {attack: mfgsm, eps_mode: fixed, eps_rel: [0.01, 0.05, 0.1, 0.25, 0.8]}
    - {attack: mgna, gamma: [0.1, 0.5, 1.0], sigma_rel: [0.01, 0.05, 0.1, 1.0, 2.5]}
    - {attack: mjsma, theta: [0.001, 0.01, 0.05, 0.08, 0.1]}
report:
  stealth_band: 8
  success_asr: 50
  threshold:
    mode: calibrated
    window: 200
    false_alarm: 0.01
